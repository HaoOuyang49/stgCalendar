[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stgCalendar"
version = "0.1.0"
description = "Solar terms and Ganzhi calendar conversion with official-publication-first data, source tracking, and explicit consent for estimates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HaoOuyang49" }]
keywords = ["solar-terms", "calendar", "provenance", "chinese-calendar"]

[project.optional-dependencies]
calendar = ["lunar-python>=1.4.8,<2", "tzdata>=2024.1"]

[project.urls]
Homepage = "https://github.com/HaoOuyang49/stgCalendar"
Issues = "https://github.com/HaoOuyang49/stgCalendar/issues"

[project.scripts]
stg-calendar = "stg_calendar.__main__:main"

[tool.setuptools.packages.find]
include = ["stg_calendar*"]

[tool.setuptools.package-data]
stg_calendar = ["pmo_updates.json"]
